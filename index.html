<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>抢车位训练 2.4</title>
<style>html,body{margin:0;background:#f4f6f9}#loading{height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#667085}</style>
</head>
<body>
<div id="loading">正在加载训练器…</div>
<script>
(async function(){
  try{
    const url='https://raw.githubusercontent.com/whoisyao/parking/3ec8b185ce931006cf5015b7807b41ae9ed492a4/index.html';
    let html=await (await fetch(url,{cache:'no-store'})).text();

    html=html
      .replaceAll('抢车位训练 2.3','抢车位训练 2.4')
      .replaceAll('移动到滑块','首次位移')
      .replaceAll('弹窗后移动','弹窗后首次位移')
      .replaceAll('popupShown=0,sliderTouched=0,raf=0','popupShown=0,sliderTouched=0,firstMovedAt=0,raf=0')
      .replaceAll("popupShown=0;sliderTouched=0;dragging=false;","popupShown=0;sliderTouched=0;firstMovedAt=0;dragging=false;")
      .replaceAll(
        "setTimeout(()=>{if(state!=='opening')return;popupShown=performance.now();state='sliding';overlay.classList.add('show')},popupDelay())",
        "setTimeout(()=>{if(state!=='opening')return;overlay.classList.add('show');requestAnimationFrame(()=>requestAnimationFrame(()=>{if(state!=='opening')return;popupShown=performance.now();state='sliding'}))},popupDelay())"
      )
      .replaceAll(
        "if(!sliderTouched){sliderTouched=performance.now();$('touchSlider').textContent=fmt(sliderTouched-popupShown)}",
        "if(!sliderTouched){sliderTouched=performance.now()}"
      )
      .replaceAll(
        "function move(e){if(!dragging)return;const p=e.touches?e.touches[0]:e;setPos(startPos+p.clientX-startX);e.preventDefault()}",
        "function move(e){if(!dragging)return;const p=e.touches?e.touches[0]:e,x=startPos+p.clientX-startX;if(!firstMovedAt&&Math.abs(x-startPos)>=3){firstMovedAt=performance.now();$('touchSlider').textContent=fmt(firstMovedAt-popupShown)}setPos(x);e.preventDefault()}"
      )
      .replaceAll(
        "const end=performance.now(),reactionMs=clicked-opened,popupMs=popupShown-clicked,moveMs=sliderTouched-popupShown,dragMs=end-sliderTouched,humanMs=reactionMs+moveMs+dragMs,elapsedMs=end-opened,sim=simulate(elapsedMs);",
        "const end=performance.now(),movedAt=firstMovedAt||sliderTouched,reactionMs=clicked-opened,popupMs=popupShown-clicked,moveMs=movedAt-popupShown,dragMs=end-movedAt,humanMs=reactionMs+moveMs+dragMs,elapsedMs=end-opened,sim=simulate(elapsedMs);"
      )
      .replaceAll('系统弹窗耗时','弹窗渲染完成')
      .replaceAll('系统弹窗 ','弹窗渲染 ')
      .replaceAll('主要损耗在弹窗出现后首次位移。','主要损耗在弹窗完成后启动滑块。');

    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='加载失败，请刷新页面重试';
    console.error(e);
  }
})();
</script>
</body>
</html>
