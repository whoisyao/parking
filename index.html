<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>抢车位训练 2.3</title>
<style>html,body{margin:0;background:#f4f6f9}#loading{height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#667085}</style>
</head>
<body>
<div id="loading">正在加载训练器…</div>
<script>
(async function(){
  try{
    const url='https://raw.githubusercontent.com/whoisyao/parking/40ba53c873ba941be472eb6cd6eabf9f3f3c12ed/index.html';
    let html=await (await fetch(url,{cache:'no-store'})).text();
    html=html
      .replace('<title>抢车位训练 2.0</title>','<title>抢车位训练 2.3</title>')
      .replace('.progress{position:absolute;inset:0 auto 0 0;width:0;background:#dce9ff}', '.progress{position:absolute;inset:0 auto 0 0;width:0;background:#76cb25;z-index:1}')
      .replace('.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px}', '.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px;z-index:0}')
      .replace('.thumb{position:absolute;left:0;top:0;width:72px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:36px;box-shadow:1px 0 5px rgba(0,0,0,.1)}', '.thumb{position:absolute;left:0;top:0;width:72px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:36px;box-shadow:1px 0 5px rgba(0,0,0,.1);z-index:2}')
      .replace('.coach b{color:var(--blue)}', '.coach b{color:var(--blue)}.timeline{margin-top:8px;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.05);padding:13px 14px}.timeline-title{font-weight:700;margin-bottom:10px}.timeline-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.timeline-item{text-align:center;background:#f6f8fc;border-radius:9px;padding:9px 2px}.timeline-item.system{background:#fff8e7}.timeline-item.action{background:#eef4ff}.timeline-item b{display:block;color:var(--blue);font-size:14px}.timeline-item.system b{color:#c98913}.timeline-item span{font-size:9px;color:#888}.timeline-summary{margin-top:9px;padding:9px;border-radius:8px;background:#eefaf3;color:#15955c;text-align:center;font-weight:700}.battle-card{margin-top:8px;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.05);padding:13px 14px}.battle-title{font-weight:700;margin-bottom:9px}.battle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.battle-item{text-align:center;background:#f6f8fc;border-radius:8px;padding:8px 2px}.battle-item b{display:block;color:var(--blue);font-size:14px}.battle-item span{font-size:9px;color:#888}.battle-result{margin-top:9px;padding:9px;border-radius:8px;text-align:center;font-weight:700}.battle-result.win{background:#eaf8df;color:#4f9c16}.battle-result.lose{background:#fff0f0;color:#d14b4b}.setting input{width:100%;height:43px;border:1px solid #dbe2ee;border-radius:9px;background:#fff;padding:0 9px;font:inherit}@media(max-width:380px){.timeline-grid{grid-template-columns:repeat(2,1fr)}}')
      .replace('<section class="stats"><div class="stat"><strong id="reaction">--</strong><span>点击反应</span></div><div class="stat"><strong id="touchSlider">--</strong><span>触达滑块</span></div><div class="stat"><strong id="dragTime">--</strong><span>滑动耗时</span></div><div class="stat"><strong id="total">--</strong><span>纯动作总时</span></div></section>', '<section class="stats"><div class="stat"><strong id="reaction">--</strong><span>点击反应</span></div><div class="stat"><strong id="touchSlider">--</strong><span>移动到滑块</span></div><div class="stat"><strong id="dragTime">--</strong><span>滑动耗时</span></div><div class="stat"><strong id="total">--</strong><span>动作合计</span></div></section>')
      .replace('<div class="coach" id="coach"><b>训练建议：</b>完成几轮后会分析四段耗时。</div>', '<div class="coach" id="coach"><b>训练建议：</b>完成几轮后会分析你的三段动作。</div><div class="timeline"><div class="timeline-title">本轮时间轴</div><div class="timeline-grid"><div class="timeline-item action"><b id="tlReaction">--</b><span>你的点击反应</span></div><div class="timeline-item system"><b id="tlPopup">--</b><span>系统弹窗耗时</span></div><div class="timeline-item action"><b id="tlMove">--</b><span>弹窗后移动</span></div><div class="timeline-item action"><b id="tlDrag">--</b><span>你的滑动</span></div><div class="timeline-item"><b id="tlHuman">--</b><span>你的动作合计</span></div><div class="timeline-item"><b id="tlElapsed">--</b><span>实际经过时间</span></div></div><div class="timeline-summary" id="timelineSummary">完成一轮后显示系统与动作分解</div></div><div class="battle-card"><div class="battle-title">500 人并发模拟</div><div class="battle-grid"><div class="battle-item"><b id="simQueue">--</b><span>排队耗时</span></div><div class="battle-item"><b id="simServer">--</b><span>网络和服务端</span></div><div class="battle-item"><b id="simFinal">--</b><span>最终确认</span></div><div class="battle-item"><b id="simRank">--</b><span>模拟排名</span></div></div><div class="battle-result" id="simResult">完成一轮后生成并发结果</div></div>')
      .replace('<div class="setting"><label>弹窗位置</label><select id="jitterMode"><option value="off">固定</option><option value="small" selected>轻微随机</option></select></div>', '<div class="setting"><label>弹窗位置</label><select id="jitterMode"><option value="off">固定</option><option value="small" selected>轻微随机</option></select></div><div class="setting"><label>参与人数</label><input id="players" type="number" min="10" max="2000" value="500"></div><div class="setting"><label>可用车位</label><input id="seats" type="number" min="1" max="1000" value="255"></div><div class="setting"><label>服务端拥堵强度</label><select id="loadMode"><option value="light">轻载</option><option value="medium">中载</option><option value="high" selected>高载</option></select></div>')
      .replace("let settings={delayMode:'120',jitterMode:'small'};", "let settings={delayMode:'120',jitterMode:'small',players:500,seats:255,loadMode:'high'};")
      .replace("let state='idle',target=0,opened=0,clicked=0,sliderTouched=0,raf=0", "let state='idle',target=0,opened=0,clicked=0,popupShown=0,sliderTouched=0,raf=0")
      .replace("function reset(){overlay.classList.remove('show');thumb.style.transform='translateX(0)';progress.style.width='0';['reaction','touchSlider','dragTime','total'].forEach(id=>$(id).textContent='--')}", "function reset(){overlay.classList.remove('show');popupShown=0;sliderTouched=0;dragging=false;thumb.style.transform='translateX(0)';progress.style.width='0';['reaction','touchSlider','dragTime','total','tlReaction','tlPopup','tlMove','tlDrag','tlHuman','tlElapsed'].forEach(id=>$(id).textContent='--');$('timelineSummary').textContent='完成一轮后显示系统与动作分解'}")
      .replace("setTimeout(()=>{if(state!=='opening')return;state='sliding';overlay.classList.add('show')},popupDelay())", "setTimeout(()=>{if(state!=='opening')return;popupShown=performance.now();state='sliding';overlay.classList.add('show')},popupDelay())")
      .replace("progress.style.width=x+thumb.clientWidth+'px';if(x>=maxX()-2)finish()", "progress.style.width=x+'px';if(x>=maxX())finish()")
      .replace("if(!sliderTouched){sliderTouched=performance.now();$('touchSlider').textContent=fmt(sliderTouched-clicked)}", "if(!sliderTouched){sliderTouched=performance.now();$('touchSlider').textContent=fmt(sliderTouched-popupShown)}")
      .replace("function finish(){if(state!=='sliding')return;state='done';const end=performance.now(),drag=end-sliderTouched,total=end-opened;$('dragTime').textContent=fmt(drag);$('total').textContent=fmt(total);records.push({at:new Date().toISOString(),campus,reactionMs:clicked-opened,touchMs:sliderTouched-clicked,dragMs:drag,totalMs:total});localStorage.setItem(RK,JSON.stringify(records.slice(-500)));progress.style.width='100%';timer.textContent=fmt(total);$('timerLabel').textContent='纯动作总用时';renderCoach();setTimeout(()=>overlay.classList.remove('show'),300)}", "function rand(min,max){return min+Math.random()*(max-min)}function normal(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}function simulate(elapsed){const players=Math.max(10,Number(settings.players)||500),seats=Math.min(players,Math.max(1,Number(settings.seats)||255)),scale=Math.max(.35,players/500);let queue,server;if(settings.loadMode==='light'){queue=rand(120,320)*scale;server=rand(70,150)}else if(settings.loadMode==='medium'){queue=rand(280,650)*scale;server=rand(100,220)}else{queue=rand(480,1050)*scale;server=rand(130,300)}const network=rand(70,210),final=elapsed+queue+server+network;let faster=0;for(let i=0;i<players-1;i++){const competitor=Math.max(350,Math.exp(Math.log(1550)+normal()*.42));if(competitor<final)faster++}const rank=Math.min(players,faster+1),win=rank<=seats;return{queue,server,network,final,rank,win,players,seats}}function renderSim(s){$('simQueue').textContent=fmt(s.queue);$('simServer').textContent=fmt(s.server+s.network);$('simFinal').textContent=fmt(s.final);$('simRank').textContent=s.rank+'/'+s.players;const box=$('simResult');box.className='battle-result '+(s.win?'win':'lose');box.textContent=s.win?'模拟抢到：进入前 '+s.seats+' 名':'模拟未抢到：超过 '+s.seats+' 个名额'}function finish(){if(state!=='sliding')return;state='done';const end=performance.now(),reactionMs=clicked-opened,popupMs=popupShown-clicked,moveMs=sliderTouched-popupShown,dragMs=end-sliderTouched,humanMs=reactionMs+moveMs+dragMs,elapsedMs=end-opened,sim=simulate(elapsedMs);$('dragTime').textContent=fmt(dragMs);$('total').textContent=fmt(humanMs);$('tlReaction').textContent=fmt(reactionMs);$('tlPopup').textContent=fmt(popupMs);$('tlMove').textContent=fmt(moveMs);$('tlDrag').textContent=fmt(dragMs);$('tlHuman').textContent=fmt(humanMs);$('tlElapsed').textContent=fmt(elapsedMs);const main=Math.max(reactionMs,moveMs,dragMs),part=main===reactionMs?'点击反应':main===moveMs?'移动到滑块':'滑动';$('timelineSummary').textContent='你的主要动作损耗：'+part+'；系统弹窗 '+fmt(popupMs)+' 不计入动作成绩';renderSim(sim);records.push({at:new Date().toISOString(),campus,reactionMs,popupMs,moveMs,touchMs:moveMs,dragMs,totalMs:humanMs,elapsedMs,simFinalMs:sim.final,simRank:sim.rank,simWin:sim.win});localStorage.setItem(RK,JSON.stringify(records.slice(-500)));progress.style.width=maxX()+'px';timer.textContent=fmt(humanMs);$('timerLabel').textContent='你的动作合计';renderCoach();setTimeout(()=>overlay.classList.remove('show'),300)}")
      .replace("const reaction=avg(a.map(x=>x.reactionMs)),touch=avg(a.map(x=>x.touchMs)),drag=avg(a.map(x=>x.dragMs));let msg=reaction>=touch&&reaction>=drag?'主要损耗在到点点击。':touch>=drag?'主要损耗在点击后触达滑块。':'主要损耗在滑动阶段。';$('coach').innerHTML='<b>最近 '+a.length+' 轮：</b>点击 '+fmt(reaction)+'，触达 '+fmt(touch)+'，滑动 '+fmt(drag)+'。'+msg", "const reaction=avg(a.map(x=>x.reactionMs)),move=avg(a.map(x=>Number.isFinite(x.moveMs)?x.moveMs:x.touchMs)),drag=avg(a.map(x=>x.dragMs));let msg=reaction>=move&&reaction>=drag?'主要损耗在到点点击。':move>=drag?'主要损耗在弹窗出现后移动到滑块。':'主要损耗在滑动阶段。';$('coach').innerHTML='<b>最近 '+a.length+' 轮动作：</b>点击 '+fmt(reaction)+'，移动 '+fmt(move)+'，滑动 '+fmt(drag)+'。'+msg")
      .replace("$('settingsBtn').onclick=()=>{$('delayMode').value=settings.delayMode;$('jitterMode').value=settings.jitterMode;$('settingsCover').classList.add('show')};", "$('settingsBtn').onclick=()=>{$('delayMode').value=settings.delayMode;$('jitterMode').value=settings.jitterMode;$('players').value=settings.players;$('seats').value=settings.seats;$('loadMode').value=settings.loadMode;$('settingsCover').classList.add('show')};")
      .replace("$('jitterMode').onchange=e=>{settings.jitterMode=e.target.value;localStorage.setItem(SK,JSON.stringify(settings))};", "$('jitterMode').onchange=e=>{settings.jitterMode=e.target.value;localStorage.setItem(SK,JSON.stringify(settings))};$('players').onchange=e=>{settings.players=Math.max(10,Number(e.target.value)||500);localStorage.setItem(SK,JSON.stringify(settings))};$('seats').onchange=e=>{settings.seats=Math.max(1,Number(e.target.value)||255);localStorage.setItem(SK,JSON.stringify(settings))};$('loadMode').onchange=e=>{settings.loadMode=e.target.value;localStorage.setItem(SK,JSON.stringify(settings))};");
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='加载失败，请刷新页面重试';
    console.error(e);
  }
})();
</script>
</body>
</html>
