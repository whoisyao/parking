<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>抢车位训练 3.2</title>
<style>
:root{--blue:#3972f6;--bg:#f4f6f9;--card:#fff;--text:#222}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;color:var(--text)}
button,select{font:inherit}.app{min-height:100svh;background:linear-gradient(var(--blue) 0 255px,var(--bg) 410px);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{width:min(100%,560px);margin:auto;padding:0 clamp(12px,4vw,22px) 28px}.head{height:112px;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:18px}.title{font-size:clamp(21px,5.5vw,26px);font-weight:700}.top-actions{display:flex;gap:7px}.ghost{border:1px solid rgba(255,255,255,.52);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 11px;font-size:13px}.nav{color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:clamp(15px,4vw,19px);margin-bottom:14px}.campus-trigger{border:0;background:transparent;color:#fff;padding:0;font-size:inherit}.card,.panel,.controls,.stat,.coach{background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.05)}.card{text-align:center;padding:clamp(18px,4vw,28px)}.label{color:#999;font-size:16px;font-weight:600}.spaces{font-size:clamp(54px,15vw,72px);font-weight:750;line-height:1.05;margin:7px 0}.online{font-size:clamp(14px,4vw,17px);margin-bottom:14px}.online b{background:#eef3ff;color:var(--blue);padding:5px 9px;border-radius:5px}.timer-box{display:none}.grab{width:100%;height:58px;border:0;border-radius:32px;background:#aec1ee;color:#fff;font-size:clamp(19px,5.2vw,23px);font-weight:500;font-variant-numeric:tabular-nums;pointer-events:none}.grab.counting{background:var(--blue);color:rgba(255,255,255,.92)}.grab.ready{background:var(--blue);color:#fff;font-weight:650;pointer-events:auto}.grab.done{background:#c7cfda;color:#fff;pointer-events:none}.plate{margin-top:13px;color:#666}.panel{margin-top:12px;padding:15px;font-size:16px}.controls{margin-top:14px;padding:10px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(110px,1fr);gap:8px}.controls select,.controls button{height:44px;border-radius:9px}.controls select{border:1px solid #dbe2ee;padding:0 8px;background:#fff;min-width:0}.controls button{border:0;background:var(--blue);color:#fff;font-weight:650}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.stat{text-align:center;padding:9px 2px}.stat strong{display:block;color:var(--blue);font-size:clamp(13px,3.6vw,16px);font-variant-numeric:tabular-nums;white-space:nowrap}.stat span{font-size:9px;color:#888}.coach{margin-top:8px;padding:12px 14px;font-size:13px;line-height:1.5;color:#536078}.coach b{color:var(--blue)}
.overlay,.sheet-cover{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:30;display:none}.overlay.show{display:block}.verify-modal{position:absolute;width:min(calc(100vw - 80px),400px);height:280px;background:#fff;border-radius:13px;left:50%;top:var(--modal-top,40vh);transform:translate(-50%,var(--jitter,0px));padding:112px 12px 0;box-shadow:0 10px 32px rgba(0,0,0,.14)}.verify-close{position:absolute;right:18px;top:13px;color:#d3d3d3;font-size:31px;line-height:1}.track{height:60px;background:#ddd;position:relative;overflow:hidden;touch-action:none;box-shadow:inset 0 0 5px rgba(0,0,0,.18)}.progress{position:absolute;inset:0 auto 0 0;width:0;background:#76cb25;z-index:1}.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px;z-index:0}.thumb{position:absolute;left:0;top:0;width:58px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:34px;box-shadow:1px 0 5px rgba(0,0,0,.1);z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet-cover.show{display:flex;align-items:flex-end}.sheet{width:100%;max-height:86svh;background:#f7f8fb;border-radius:20px 20px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0}.round{border:0;border-radius:50%;width:34px;height:34px;font-size:22px}.campus-list{display:flex;flex-direction:column;margin:14px -16px -18px}.campus-row{background:#fff;border:0;border-bottom:1px solid #eee;padding:18px 20px;text-align:left;font-size:20px;display:flex;justify-content:space-between}.check{color:var(--blue);visibility:hidden}.campus-row.active .check{visibility:visible}.setting{background:#fff;border-radius:10px;padding:13px;margin-top:10px}.setting label{display:block;font-size:13px;color:#667085;margin-bottom:7px}.setting select{width:100%;height:43px;border:1px solid #dbe2ee;border-radius:9px;background:#fff;padding:0 9px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.sum,.record{background:#fff;border-radius:10px}.sum{text-align:center;padding:9px 3px}.sum b{display:block;color:var(--blue)}.sum span{font-size:10px;color:#888}.records{display:flex;flex-direction:column;gap:7px}.record{padding:10px 12px;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.actions button{height:40px;border:0;border-radius:9px;background:var(--blue);color:#fff}.actions .danger{background:#fff;color:#d44;border:1px solid #efcaca}
@media(min-width:700px){body{background:#e9edf4}.app{width:720px;min-height:100vh;margin:auto;box-shadow:0 0 34px rgba(0,0,0,.12);background:linear-gradient(var(--blue) 0 225px,var(--bg) 380px)}.wrap{width:100%;max-width:720px;padding:0 42px 34px}.head{height:92px}.card{padding:20px 34px}.spaces{font-size:64px}.panel{padding:13px}.verify-modal{width:540px;height:min(430px,calc(100vh - 40px));max-height:430px;padding:clamp(120px,31vh,205px) 22px 0;border-radius:14px}.track{height:64px}.thumb{height:64px;width:104px}.sheet{max-width:720px;margin:auto}.overlay{overflow:auto}.stats{grid-template-columns:repeat(4,1fr)}}
@media(max-height:720px) and (max-width:699px){.head{height:84px}.card{padding:16px}.spaces{font-size:48px}.panel{padding:12px;margin-top:8px}.verify-modal{height:250px;padding-top:96px}}
@media(max-width:380px){.title{font-size:20px}.ghost{padding:7px 8px;font-size:12px}.stats{grid-template-columns:repeat(2,1fr)}.verify-modal{width:calc(100vw - 72px)}}
</style>
</head>
<body>
<main class="app"><div class="wrap">
<header class="head"><div class="title">阿里智享停车</div><div class="top-actions"><button class="ghost" id="settingsBtn">训练设置</button><button class="ghost" id="historyBtn">历史成绩</button></div></header>
<div class="nav"><button class="campus-trigger" id="campusBtn"><span id="campusName">西溪A区</span>⌄</button><span>我的记录　|　规则</span></div>
<section class="card"><div class="label">剩余车位</div><div class="spaces" id="spaces">31</div><div class="online">当前园区有 <b id="online">348</b> 人同时在线</div><div class="timer-box"><div id="timerLabel"></div><div id="timer"></div></div><button class="grab" id="grab">请先开始训练</button><div class="plate">浙AFR2510 ✎</div></section>
<div class="panel">🔊　<span id="noticeCampus">西溪A区</span>公告：</div><div class="panel">▥　<b>手速排行</b></div>
<section class="controls"><select id="mode"><option value="5">快速训练：5秒</option><option value="10">快速训练：10秒</option><option value="60">真实训练：60秒</option></select><button id="start">开始训练</button></section>
<section class="stats"><div class="stat"><strong id="reaction">--</strong><span>点击反应</span></div><div class="stat"><strong id="touchSlider">--</strong><span>移动到滑块</span></div><div class="stat"><strong id="dragTime">--</strong><span>滑动耗时</span></div><div class="stat"><strong id="total">--</strong><span>动作合计</span></div></section>
<div class="coach" id="coach"><b>训练建议：</b>完成几轮后开始分析。</div>
</div></main>
<div class="overlay" id="overlay"><div class="verify-modal" id="modal"><div class="verify-close">×</div><div class="track" id="track"><div class="progress" id="progress"></div><div class="tracktext">向右滑动验证</div><div class="thumb" id="thumb">»</div></div></div></div>
<div class="sheet-cover" id="campusCover"><div class="sheet"><div class="sheet-head"><h2>选择园区</h2><button class="round" id="campusClose">×</button></div><div class="campus-list" id="campusList"></div></div></div>
<div class="sheet-cover" id="settingsCover"><div class="sheet"><div class="sheet-head"><h2>训练设置</h2><button class="round" id="settingsClose">×</button></div><div class="setting"><label>按钮点击后弹窗延迟</label><select id="delayMode"><option value="0">0ms</option><option value="35">35ms</option><option value="80">80ms</option><option value="120" selected>120ms</option><option value="random">随机 80–180ms</option></select></div><div class="setting"><label>弹窗位置</label><select id="jitterMode"><option value="off">固定</option><option value="small" selected>轻微随机</option></select></div></div></div>
<div class="sheet-cover" id="historyCover"><div class="sheet"><div class="sheet-head"><h2>训练记录</h2><button class="round" id="historyClose">×</button></div><div class="summary"><div class="sum"><b id="sumCount">0</b><span>轮数</span></div><div class="sum"><b id="sumBest">--</b><span>最佳</span></div><div class="sum"><b id="sumAvg">--</b><span>平均</span></div><div class="sum"><b id="sumP95">--</b><span>P95</span></div></div><div class="actions"><button id="exportBtn">导出</button><button class="danger" id="clearBtn">清空</button></div><div class="records" id="records"></div></div></div>
<script>
const $=id=>document.getElementById(id),RK='parking_records_v6',SK='parking_settings_v4',CK='parking_campus_v1';
const campuses=[{name:'西溪A区',spaces:31},{name:'云谷园区',spaces:31},{name:'菜鸟总部园区',spaces:18},{name:'高桥云港',spaces:12},{name:'西溪C区',spaces:25}];
let campus=localStorage.getItem(CK)||'西溪A区',records=[];try{records=JSON.parse(localStorage.getItem(RK)||'[]')}catch{}
let settings={delayMode:'120',jitterMode:'small'};try{settings={...settings,...JSON.parse(localStorage.getItem(SK)||'{}')}}catch{}
let state='idle',target=0,opened=0,clicked=0,popupShown=0,sliderTouched=0,raf=0,dragging=false,startX=0,startPos=0;
const grab=$('grab'),overlay=$('overlay'),modal=$('modal'),track=$('track'),thumb=$('thumb'),progress=$('progress'),mode=$('mode');
const fmt=n=>Math.round(n)+'ms',avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function clock10(ms){ms=Math.max(0,Math.ceil(ms/10)*10);return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0')+'.'+String(Math.floor(ms%1000)).padStart(3,'0')}
function applyCampus(){const c=campuses.find(x=>x.name===campus)||campuses[0];$('campusName').textContent=$('noticeCampus').textContent=c.name;$('spaces').textContent=c.spaces;$('online').textContent=286+Math.floor(Math.random()*227);localStorage.setItem(CK,c.name)}
function renderCampus(){const box=$('campusList');box.innerHTML='';campuses.forEach(c=>{const b=document.createElement('button');b.className='campus-row'+(c.name===campus?' active':'');b.innerHTML='<span>'+c.name+'</span><span class="check">✓</span>';b.onclick=()=>{campus=c.name;applyCampus();$('campusCover').classList.remove('show')};box.appendChild(b)})}
function resetRound(){clearTimeout(raf);overlay.classList.remove('show');state='idle';clicked=popupShown=sliderTouched=0;dragging=false;thumb.style.transform='translateX(0)';progress.style.width='0';grab.className='grab';grab.textContent='请先开始训练';['reaction','touchSlider','dragTime','total'].forEach(id=>$(id).textContent='--')}
function begin(){resetRound();target=performance.now()+Number(mode.value)*1000;state='waiting';grab.classList.add('counting');grab.textContent=clock10(Number(mode.value)*1000)+'后开抢';$('start').textContent='重新开始';tick()}
function tick(){if(state!=='waiting')return;const remain=target-performance.now();if(remain<=0){grab.textContent='立即开抢';grab.classList.remove('counting');grab.classList.add('ready');opened=performance.now();state='ready';return}grab.textContent=clock10(remain)+'后开抢';raf=setTimeout(tick,10)}
function popupDelay(){return settings.delayMode==='random'?80+Math.random()*100:Number(settings.delayMode)}
function positionModal(){const r=grab.getBoundingClientRect(),desktop=innerWidth>=700;let h=desktop?Math.min(430,innerHeight-40):Math.min(280,Math.max(250,innerHeight*.31));let top=desktop?Math.max(20,(innerHeight-h)/2):Math.max(12,Math.min(innerHeight-h-12,r.top-16));modal.style.setProperty('--modal-top',top+'px');modal.style.setProperty('--jitter',settings.jitterMode==='small'?(Math.random()*8-4)+'px':'0px')}
grab.onclick=()=>{if(state!=='ready')return;clicked=performance.now();$('reaction').textContent=fmt(clicked-opened);state='opening';positionModal();setTimeout(()=>{if(state!=='opening')return;popupShown=performance.now();state='sliding';overlay.classList.add('show')},popupDelay())};
function maxX(){return track.clientWidth-thumb.clientWidth}
function setPos(x){x=Math.max(0,Math.min(maxX(),x));thumb.style.transform='translateX('+x+'px)';progress.style.width=x+'px';if(x>=maxX()-2)finish()}
function pointerDown(e){if(state!=='sliding'||!e.isPrimary)return;if(!sliderTouched){sliderTouched=performance.now();$('touchSlider').textContent=fmt(sliderTouched-popupShown)}dragging=true;startX=e.clientX;const t=getComputedStyle(thumb).transform;startPos=t&&t!=='none'?new DOMMatrixReadOnly(t).m41:0;try{thumb.setPointerCapture(e.pointerId)}catch{}e.preventDefault()}
function pointerMove(e){if(!dragging||!e.isPrimary)return;setPos(startPos+e.clientX-startX);e.preventDefault()}
function pointerEnd(e){if(!e.isPrimary)return;dragging=false;try{if(thumb.hasPointerCapture(e.pointerId))thumb.releasePointerCapture(e.pointerId)}catch{}}
function finish(){if(state!=='sliding')return;state='done';dragging=false;const end=performance.now(),reaction=clicked-opened,move=sliderTouched-popupShown,drag=end-sliderTouched,total=reaction+move+drag;$('dragTime').textContent=fmt(drag);$('total').textContent=fmt(total);records.push({at:new Date().toISOString(),campus,reactionMs:reaction,touchMs:move,dragMs:drag,totalMs:total});localStorage.setItem(RK,JSON.stringify(records.slice(-500)));progress.style.width=maxX()+'px';grab.className='grab done';grab.textContent='本轮已完成';renderCoach();setTimeout(()=>{overlay.classList.remove('show');grab.className='grab done';grab.textContent='本轮已完成'},300)}
thumb.addEventListener('pointerdown',pointerDown,{passive:false});thumb.addEventListener('pointermove',pointerMove,{passive:false});thumb.addEventListener('pointerup',pointerEnd);thumb.addEventListener('pointercancel',pointerEnd);thumb.addEventListener('lostpointercapture',()=>{dragging=false});
function renderCoach(){const a=records.slice(-20);if(a.length<3){$('coach').innerHTML='<b>训练建议：</b>再完成 '+(3-a.length)+' 轮后开始分析。';return}const reaction=avg(a.map(x=>x.reactionMs)),touch=avg(a.map(x=>x.touchMs)),drag=avg(a.map(x=>x.dragMs));let msg=reaction>=touch&&reaction>=drag?'主要损耗在到点点击。':touch>=drag?'主要损耗在弹窗出现后移动到滑块。':'主要损耗在滑动阶段。';$('coach').innerHTML='<b>最近 '+a.length+' 轮：</b>点击 '+fmt(reaction)+'，移动 '+fmt(touch)+'，滑动 '+fmt(drag)+'。'+msg}
function renderHistory(){const a=records.map(x=>x.totalMs).filter(Number.isFinite),sorted=[...a].sort((x,y)=>x-y);$('sumCount').textContent=a.length;$('sumBest').textContent=a.length?fmt(sorted[0]):'--';$('sumAvg').textContent=a.length?fmt(avg(a)):'--';$('sumP95').textContent=a.length?fmt(sorted[Math.min(sorted.length-1,Math.ceil(sorted.length*.95)-1)]):'--';$('records').innerHTML=records.slice().reverse().slice(0,100).map(r=>'<div class="record"><b>'+fmt(r.totalMs)+'</b> · 点击 '+fmt(r.reactionMs)+' · 移动 '+fmt(r.touchMs)+' · 滑动 '+fmt(r.dragMs)+'<br><small>'+new Date(r.at).toLocaleString()+' · '+r.campus+'</small></div>').join('')||'<div class="record">暂无记录</div>'}
$('start').onclick=begin;$('campusBtn').onclick=()=>{renderCampus();$('campusCover').classList.add('show')};$('campusClose').onclick=()=>$('campusCover').classList.remove('show');$('settingsBtn').onclick=()=>{$('delayMode').value=settings.delayMode;$('jitterMode').value=settings.jitterMode;$('settingsCover').classList.add('show')};$('settingsClose').onclick=()=>$('settingsCover').classList.remove('show');$('delayMode').onchange=e=>{settings.delayMode=e.target.value;localStorage.setItem(SK,JSON.stringify(settings))};$('jitterMode').onchange=e=>{settings.jitterMode=e.target.value;localStorage.setItem(SK,JSON.stringify(settings))};$('historyBtn').onclick=()=>{renderHistory();$('historyCover').classList.add('show')};$('historyClose').onclick=()=>$('historyCover').classList.remove('show');$('clearBtn').onclick=()=>{if(confirm('确定清空记录吗？')){records=[];localStorage.setItem(RK,'[]');renderHistory();renderCoach()}};$('exportBtn').onclick=()=>{const b=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='parking-training.json';a.click()};
applyCampus();renderCoach();resetRound();
</script>
</body>
</html>
