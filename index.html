<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>抢车位训练 2.2</title>
<style>html,body{margin:0;background:#f4f6f9}#loading{height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#667085}</style>
</head>
<body>
<div id="loading">正在加载训练器…</div>
<script>
(async function(){
  try{
    const url='https://raw.githubusercontent.com/whoisyao/parking/40ba53c873ba941be472eb6cd6eabf9f3f3c12ed/index.html';
    let html=await (await fetch(url,{cache:'no-store'})).text();
    html=html
      .replace('<title>抢车位训练 2.0</title>','<title>抢车位训练 2.2</title>')
      .replace('.progress{position:absolute;inset:0 auto 0 0;width:0;background:#dce9ff}', '.progress{position:absolute;inset:0 auto 0 0;width:0;background:#76cb25;z-index:1}')
      .replace('.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px}', '.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px;z-index:0}')
      .replace('.thumb{position:absolute;left:0;top:0;width:72px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:36px;box-shadow:1px 0 5px rgba(0,0,0,.1)}', '.thumb{position:absolute;left:0;top:0;width:72px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:36px;box-shadow:1px 0 5px rgba(0,0,0,.1);z-index:2}')
      .replace('.coach b{color:var(--blue)}', '.coach b{color:var(--blue)}.battle-card{margin-top:8px;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.05);padding:13px 14px}.battle-title{font-weight:700;margin-bottom:9px}.battle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.battle-item{text-align:center;background:#f6f8fc;border-radius:8px;padding:8px 2px}.battle-item b{display:block;color:var(--blue);font-size:14px}.battle-item span{font-size:9px;color:#888}.battle-result{margin-top:9px;padding:9px;border-radius:8px;text-align:center;font-weight:700}.battle-result.win{background:#eaf8df;color:#4f9c16}.battle-result.lose{background:#fff0f0;color:#d14b4b}.setting input{width:100%;height:43px;border:1px solid #dbe2ee;border-radius:9px;background:#fff;padding:0 9px;font:inherit}')
      .replace('<div class="coach" id="coach"><b>训练建议：</b>完成几轮后会分析四段耗时。</div>', '<div class="coach" id="coach"><b>训练建议：</b>完成几轮后会分析四段耗时。</div><div class="battle-card"><div class="battle-title">500 人并发模拟</div><div class="battle-grid"><div class="battle-item"><b id="simQueue">--</b><span>排队耗时</span></div><div class="battle-item"><b id="simServer">--</b><span>服务端处理</span></div><div class="battle-item"><b id="simFinal">--</b><span>最终确认</span></div><div class="battle-item"><b id="simRank">--</b><span>模拟排名</span></div></div><div class="battle-result" id="simResult">完成一轮后生成并发结果</div></div>')
      .replace('<div class="setting"><label>弹窗位置</label><select id="jitterMode"><option value="off">固定</option><option value="small" selected>轻微随机</option></select></div>', '<div class="setting"><label>弹窗位置</label><select id="jitterMode"><option value="off">固定</option><option value="small" selected>轻微随机</option></select></div><div class="setting"><label>参与人数</label><input id="players" type="number" min="10" max="2000" value="500"></div><div class="setting"><label>可用车位</label><input id="seats" type="number" min="1" max="1000" value="255"></div><div class="setting"><label>服务端拥堵强度</label><select id="loadMode"><option value="light">轻载</option><option value="medium">中载</option><option value="high" selected>高载（推荐）</option></select></div>')
      .replace("let settings={delayMode:'120',jitterMode:'small'};", "let settings={delayMode:'120',jitterMode:'small',players:500,seats:255,loadMode:'high'};")
      .replace("function reset(){overlay.classList.remove('show');thumb.style.transform='translateX(0)';progress.style.width='0';", "function reset(){overlay.classList.remove('show');sliderTouched=0;dragging=false;thumb.style.transform='translateX(0)';progress.style.width='0';")
      .replace("progress.style.width=x+thumb.clientWidth+'px';if(x>=maxX()-2)finish()", "progress.style.width=x+'px';if(x>=maxX())finish()")
      .replace("function finish(){if(state!=='sliding')return;state='done';const end=performance.now(),drag=end-sliderTouched,total=end-opened;$('dragTime').textContent=fmt(drag);$('total').textContent=fmt(total);records.push({at:new Date().toISOString(),campus,reactionMs:clicked-opened,touchMs:sliderTouched-clicked,dragMs:drag,totalMs:total});localStorage.setItem(RK,JSON.stringify(records.slice(-500)));progress.style.width='100%';timer.textContent=fmt(total);$('timerLabel').textContent='纯动作总用时';renderCoach();setTimeout(()=>overlay.classList.remove('show'),300)}", "function rand(min,max){return min+Math.random()*(max-min)}function normal(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}function simulate(total){const players=Math.max(10,Number(settings.players)||500),seats=Math.min(players,Math.max(1,Number(settings.seats)||255)),scale=Math.max(.35,players/500);let queue,server;if(settings.loadMode==='light'){queue=rand(120,320)*scale;server=rand(70,150)}else if(settings.loadMode==='medium'){queue=rand(280,650)*scale;server=rand(100,220)}else{queue=rand(480,1050)*scale;server=rand(130,300)}const network=rand(70,210),final=total+queue+server+network;let faster=0;for(let i=0;i<players-1;i++){const competitor=Math.max(350,Math.exp(Math.log(1550)+normal()*.42));if(competitor<final)faster++}const rank=Math.min(players,faster+1),win=rank<=seats;return{queue,server,network,final,rank,win,players,seats}}function renderSim(s){$('simQueue').textContent=fmt(s.queue);$('simServer').textContent=fmt(s.server+s.network);$('simFinal').textContent=fmt(s.final);$('simRank').textContent=s.rank+'/'+s.players;const box=$('simResult');box.className='battle-result '+(s.win?'win':'lose');box.textContent=s.win?'模拟抢到：排名在 '+s.seats+' 个车位以内':'模拟未抢到：超过 '+s.seats+' 个车位名额'}function finish(){if(state!=='sliding')return;state='done';const end=performance.now(),drag=end-sliderTouched,total=end-opened,sim=simulate(total);$('dragTime').textContent=fmt(drag);$('total').textContent=fmt(total);renderSim(sim);records.push({at:new Date().toISOString(),campus,reactionMs:clicked-opened,touchMs:sliderTouched-clicked,dragMs:drag,totalMs:total,simFinalMs:sim.final,simRank:sim.rank,simWin:sim.win,players:sim.players,seats:sim.seats});localStorage.setItem(RK,JSON.stringify(records.slice(-500)));progress.style.width=maxX()+'px';timer.textContent=fmt(sim.final);$('timerLabel').textContent='并发模拟最终确认';renderCoach();setTimeout(()=>overlay.classList.remove('show'),300)}")
      .replace("$('settingsBtn').onclick=()=>{$('delayMode').value=settings.delayMode;$('jitterMode').value=settings.jitterMode;$('settingsCover').classList.add('show')};", "$('settingsBtn').onclick=()=>{$('delayMode').value=settings.delayMode;$('jitterMode').value=settings.jitterMode;$('players').value=settings.players;$('seats').value=settings.seats;$('loadMode').value=settings.loadMode;$('settingsCover').classList.add('show')};")
      .replace("$('jitterMode').onchange=e=>{settings.jitterMode=e.target.value;localStorage.setItem(SK,JSON.stringify(settings))};", "$('jitterMode').onchange=e=>{settings.jitterMode=e.target.value;localStorage.setItem(SK,JSON.stringify(settings))};$('players').onchange=e=>{settings.players=Math.max(10,Number(e.target.value)||500);localStorage.setItem(SK,JSON.stringify(settings))};$('seats').onchange=e=>{settings.seats=Math.max(1,Number(e.target.value)||255);localStorage.setItem(SK,JSON.stringify(settings))};$('loadMode').onchange=e=>{settings.loadMode=e.target.value;localStorage.setItem(SK,JSON.stringify(settings))};");
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='加载失败，请刷新页面重试';
    console.error(e);
  }
})();
</script>
</body>
</html>
