<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>抢车位训练 2.1</title>
<style>html,body{margin:0;background:#f4f6f9}#loading{height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#667085}</style>
</head>
<body>
<div id="loading">正在加载训练器…</div>
<script>
(async function(){
  try{
    const url='https://raw.githubusercontent.com/whoisyao/parking/40ba53c873ba941be472eb6cd6eabf9f3f3c12ed/index.html';
    let html=await (await fetch(url,{cache:'no-store'})).text();
    html=html
      .replace('<title>抢车位训练 2.0</title>','<title>抢车位训练 2.1</title>')
      .replace('.progress{position:absolute;inset:0 auto 0 0;width:0;background:#dce9ff}', '.progress{position:absolute;inset:0 auto 0 0;width:0;background:#76cb25;z-index:1}')
      .replace('.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px}', '.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px;z-index:0}')
      .replace('.thumb{position:absolute;left:0;top:0;width:72px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:36px;box-shadow:1px 0 5px rgba(0,0,0,.1)}', '.thumb{position:absolute;left:0;top:0;width:72px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:36px;box-shadow:1px 0 5px rgba(0,0,0,.1);z-index:2}')
      .replace("function reset(){overlay.classList.remove('show');thumb.style.transform='translateX(0)';progress.style.width='0';", "function reset(){overlay.classList.remove('show');sliderTouched=0;dragging=false;thumb.style.transform='translateX(0)';progress.style.width='0';")
      .replace("progress.style.width=x+thumb.clientWidth+'px';if(x>=maxX()-2)finish()", "progress.style.width=x+'px';if(x>=maxX())finish()")
      .replace("progress.style.width='100%';timer.textContent=fmt(total)", "progress.style.width=maxX()+'px';timer.textContent=fmt(total)");
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='加载失败，请刷新页面重试';
    console.error(e);
  }
})();
</script>
</body>
</html>
