<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>抢车位训练 Pro</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;color:#222}button,select{font:inherit}.app{min-height:100svh;background:linear-gradient(#3972f6 0 255px,#f4f6f9 410px);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.wrap{width:min(100%,560px);margin:auto;padding:0 clamp(12px,4vw,22px) 28px}.head{height:112px;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:18px}.title{font-size:clamp(21px,5.5vw,26px);font-weight:700}.top-actions{display:flex;gap:7px}.ghost{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 11px;font-size:13px}.nav{color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:clamp(15px,4vw,19px);margin-bottom:14px}.campus-trigger{border:0;background:transparent;color:#fff;padding:0;font-size:inherit}.card,.panel,.controls,.stat,.coach{background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.05)}.card{text-align:center;padding:clamp(18px,4vw,28px)}.label{color:#999;font-size:16px;font-weight:600}.spaces{font-size:clamp(54px,15vw,72px);font-weight:750;line-height:1.05;margin:7px 0}.online{font-size:clamp(14px,4vw,17px);margin-bottom:14px}.online b{background:#eef3ff;color:#3972ff;padding:5px 9px;border-radius:5px}.timer-box{height:74px;background:#f3f6ff;border-radius:11px;display:grid;place-content:center;margin-bottom:14px}.timer-label{font-size:12px;color:#8894ad}.timer{font-size:clamp(30px,9vw,38px);font-weight:750;color:#3972f6;font-variant-numeric:tabular-nums;letter-spacing:.4px}.timer.ready{color:#14a467}.grab{width:100%;height:58px;border:0;border-radius:32px;background:#aec1ee;color:#fff;font-size:clamp(20px,5.5vw,24px);font-weight:650}.grab.ready{background:#3972f6}.plate{margin-top:13px;color:#666}.panel{margin-top:12px;padding:15px;font-size:16px}.controls{margin-top:14px;padding:10px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(110px,1fr);gap:8px}.controls select,.controls button{height:44px;border-radius:9px}.controls select{border:1px solid #dbe2ee;padding:0 8px;background:#fff;min-width:0}.controls button{border:0;background:#3972f6;color:#fff;font-weight:650}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.stat{text-align:center;padding:9px 2px}.stat strong{display:block;color:#3972f6;font-size:clamp(13px,3.6vw,16px);font-variant-numeric:tabular-nums;white-space:nowrap}.stat span{font-size:9px;color:#888}.coach{margin-top:8px;padding:12px 14px;font-size:13px;line-height:1.5;color:#536078}.coach b{color:#3972f6}.cover,.sheet-cover{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:20;display:none}.cover.show{display:block;padding:0}.modal{width:min(calc(100vw - 104px),380px);height:clamp(260px,31svh,290px);background:#fff;border-radius:13px;padding:40% 16px 0;position:absolute;left:50%;top:var(--modal-top,40.4svh);transform:translate(-50%,var(--jitter,0px))}.close{position:absolute;right:18px;top:14px;color:#ccc;font-size:30px}.track{height:60px;background:#ddd;position:relative;overflow:hidden;touch-action:none;box-shadow:inset 0 0 5px rgba(0,0,0,.18)}.progress{position:absolute;inset:0 auto 0 0;width:0;background:#dce9ff}.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px}.thumb{position:absolute;left:0;top:0;width:72px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:36px;box-shadow:1px 0 5px rgba(0,0,0,.1)}.sheet-cover.show{display:flex;align-items:flex-end}.sheet{width:100%;max-height:86svh;background:#f7f8fb;border-radius:20px 20px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0}.round{border:0;border-radius:50%;width:34px;height:34px;font-size:22px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.sum,.record,.setting,.campus-row{background:#fff;border-radius:10px}.sum{text-align:center;padding:9px 3px}.sum b{display:block;color:#3972f6}.sum span{font-size:10px;color:#888}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{height:40px;border:0;border-radius:9px;background:#3972f6;color:#fff}.actions .danger{background:#fff;color:#d44;border:1px solid #efcaca}.records{display:flex;flex-direction:column;gap:7px;margin-top:12px}.record{padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}.record .t{color:#888;font-size:11px}.record .total{grid-row:1/3;grid-column:2;align-self:center;color:#3972f6;font-size:17px;font-weight:700}.setting{padding:13px;margin-top:10px}.setting label{display:block;font-size:13px;color:#667085;margin-bottom:7px}.setting select{width:100%;height:43px;border:1px solid #dbe2ee;border-radius:9px;background:#fff;padding:0 9px}.hint{font-size:12px;color:#8a94a6;line-height:1.5;margin-top:6px}.campus-list{display:flex;flex-direction:column;gap:1px;margin:14px -16px -18px}.campus-row{border-radius:0;padding:18px 20px;border:0;text-align:left;font-size:20px;display:flex;justify-content:space-between;align-items:center}.campus-row .check{color:#3972f6;font-weight:700;visibility:hidden}.campus-row.active .check{visibility:visible}.empty{text-align:center;color:#999;padding:28px}@media(max-height:720px){.head{height:84px}.card{padding:16px}.spaces{font-size:48px}.timer-box{height:64px}.panel{padding:12px;margin-top:8px}.controls{margin-top:8px}.stats{margin-top:6px}.modal{height:250px;min-height:250px;padding-top:99px}}@media(max-width:380px){.title{font-size:20px}.ghost{padding:7px 8px;font-size:12px}.summary{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.modal{width:calc(100vw - 84px)}}@media(max-width:340px){.controls{grid-template-columns:1fr}.nav{font-size:14px}.modal{width:calc(100vw - 64px)}}
</style>
</head>
<body>
<main class="app"><div class="wrap">
<header class="head"><div class="title">阿里智享停车</div><div class="top-actions"><button class="ghost" id="settingsBtn">训练设置</button><button class="ghost" id="historyBtn">历史成绩</button></div></header>
<div class="nav"><button class="campus-trigger" id="campusBtn"><span id="campusName">云谷园区</span>⌄</button><span>我的记录　|　规则</span></div>
<section class="card"><div class="label">剩余车位</div><div class="spaces" id="spaces">31</div><div class="online">当前园区有 <b id="online">1</b> 人同时在线</div><div class="timer-box"><div class="timer-label" id="timerLabel">等待开始训练</div><div class="timer" id="timer">00:05.00</div></div><button class="grab" id="grab">等待开抢</button><div class="plate">浙AFR2510 ✎</div></section>
<div class="panel">🔊　<span id="noticeCampus">云谷园区</span>公告：</div><div class="panel">▥　<b>手速排行</b></div>
<section class="controls"><select id="mode"><option value="5">快速训练：5秒</option><option value="10">快速训练：10秒</option><option value="60">真实训练：60秒</option></select><button id="start">开始训练</button></section>
<section class="stats"><div class="stat"><strong id="reaction">--</strong><span>点击反应</span></div><div class="stat"><strong id="slideTime">--</strong><span>滑动阶段</span></div><div class="stat"><strong id="localTotal">--</strong><span>纯手速总时</span></div><div class="stat"><strong id="battleTotal">--</strong><span>实战估算</span></div></section>
<div class="coach" id="coach"><b>训练建议：</b>完成几轮后，这里会分析你的点击和滑动表现。</div>
</div></main>
<div class="cover" id="cover"><div class="modal" id="modal"><div class="close">×</div><div class="track" id="track"><div class="progress" id="progress"></div><div class="tracktext">向右滑动验证</div><div class="thumb" id="thumb">»</div></div></div></div>
<div class="sheet-cover" id="campusCover"><div class="sheet"><div class="sheet-head"><h2>选择园区</h2><button class="round" id="campusClose">×</button></div><div class="campus-list" id="campusList"></div></div></div>
<div class="sheet-cover" id="historyCover"><div class="sheet"><div class="sheet-head"><h2>训练记录</h2><button class="round" id="historyClose">×</button></div><div class="summary"><div class="sum"><b id="sumCount">0</b><span>完成轮数</span></div><div class="sum"><b id="sumBest">--</b><span>最佳纯手速</span></div><div class="sum"><b id="sumAvg">--</b><span>平均纯手速</span></div><div class="sum"><b id="sumBattle">--</b><span>平均实战估算</span></div></div><div class="actions"><button id="exportBtn">导出备份</button><button class="danger" id="clearBtn">清空记录</button></div><div class="records" id="records"></div></div></div>
<div class="sheet-cover" id="settingsCover"><div class="sheet"><div class="sheet-head"><h2>训练设置</h2><button class="round" id="settingsClose">×</button></div>
<div class="setting"><label>点击后弹窗延迟</label><select id="delayMode"><option value="0">0ms（即时）</option><option value="35">35ms</option><option value="80">80ms</option><option value="120" selected>120ms（更接近 App）</option><option value="random">随机 80–180ms</option></select><div class="hint">计入滑动阶段，用于模拟点击后弹窗真正出现的等待。</div></div>
<div class="setting"><label>提交和网络延迟</label><select id="networkMode"><option value="0">不模拟</option><option value="300">固定 300ms</option><option value="random450" selected>随机 450–750ms（推荐）</option><option value="random700">随机 700–1000ms</option></select><div class="hint">只计入“实战估算”，不影响纯手速成绩。真实值会受网络、App 和服务端负载影响。</div></div>
<div class="setting"><label>滑块弹窗位置</label><select id="jitterMode"><option value="off">固定位置</option><option value="small" selected>轻微随机（±4px）</option><option value="medium">明显随机（±10px）</option></select></div>
</div></div>
<script>
const $=id=>document.getElementById(id),K='parking_records_v4',OLD='parking_records_v3',SK='parking_settings_v2',CK='parking_campus_v1';
const campuses=[{name:'西溪A区',spaces:31},{name:'云谷园区',spaces:31},{name:'菜鸟总部园区',spaces:18},{name:'高桥云港',spaces:12},{name:'西溪C区',spaces:25}];
let campus=localStorage.getItem(CK)||'云谷园区';let rec=[];try{rec=JSON.parse(localStorage.getItem(K)||localStorage.getItem(OLD)||'[]')}catch{}
let settings={delayMode:'120',networkMode:'random450',jitterMode:'small'};try{settings={...settings,...JSON.parse(localStorage.getItem(SK)||'{}')}}catch{}
let state='idle',target=0,opened=0,clicked=0,raf=0,dragging=false,sx=0,sp=0,currentNetwork=0;
const timer=$('timer'),timerLabel=$('timerLabel'),grab=$('grab'),mode=$('mode'),cover=$('cover'),modal=$('modal'),track=$('track'),thumb=$('thumb'),progress=$('progress');
function fmt(ms){return Math.round(ms)+'ms'}function clock10(ms){ms=Math.max(0,Math.ceil(ms/10)*10);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),cs=Math.floor(ms%1000/10);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0')}
function save(){localStorage.setItem(K,JSON.stringify(rec.slice(-500)))}function saveSettings(){localStorage.setItem(SK,JSON.stringify(settings))}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}function vals(k){return rec.map(x=>x[k]).filter(Number.isFinite)}
function applyCampus(){const c=campuses.find(x=>x.name===campus)||campuses[0];$('campusName').textContent=c.name;$('noticeCampus').textContent=c.name;$('spaces').textContent=c.spaces;$('online').textContent=1+Math.floor(Math.random()*3);localStorage.setItem(CK,c.name)}
function renderCampus(){const box=$('campusList');box.innerHTML='';campuses.forEach(c=>{const b=document.createElement('button');b.className='campus-row'+(c.name===campus?' active':'');b.innerHTML='<span>'+c.name+'</span><span class="check">✓</span>';b.onclick=()=>{campus=c.name;applyCampus();renderCampus();$('campusCover').classList.remove('show')};box.appendChild(b)})}
function renderCoach(){const a=rec.slice(-20);if(a.length<3){$('coach').innerHTML='<b>训练建议：</b>再完成 '+(3-a.length)+' 轮后开始分析。';return}const r=avg(a.map(x=>x.reactionMs)),s=avg(a.map(x=>x.slideMs)),t=avg(a.map(x=>x.totalMs)),b=avg(a.map(x=>x.battleMs||x.totalMs));let msg=r>s*.75?'点击反应仍是主要损耗，倒计时到零时直接落指。':s>r*1.35?'滑动阶段更慢，弹窗出现后要一次滑到底。':'点击和滑动比较均衡，下一步重点是稳定性。';$('coach').innerHTML='<b>最近 '+a.length+' 轮：</b>纯手速 '+fmt(t)+'，实战估算 '+fmt(b)+'。'+msg}
function reset(){cover.classList.remove('show');thumb.style.transform='translateX(0)';progress.style.width='0';$('reaction').textContent=$('slideTime').textContent=$('localTotal').textContent=$('battleTotal').textContent='--'}
function begin(){cancelAnimationFrame(raf);reset();target=performance.now()+Number(mode.value)*1000;state='waiting';grab.textContent='等待开抢';grab.classList.remove('ready');timer.classList.remove('ready');timerLabel.textContent='距离 19:00 开抢';tick()}
function tick(){if(state!=='waiting')return;const r=target-performance.now();if(r<=0){timer.textContent='00:00.00';timer.classList.add('ready');timerLabel.textContent='开抢时间已到';grab.textContent='立即开抢';grab.classList.add('ready');opened=performance.now();state='ready';return}timer.textContent=clock10(r);raf=requestAnimationFrame(tick)}
function delayMs(){return settings.delayMode==='random'?80+Math.random()*100:Number(settings.delayMode)}function networkMs(){if(settings.networkMode==='random450')return 450+Math.random()*300;if(settings.networkMode==='random700')return 700+Math.random()*300;return Number(settings.networkMode)}function jitter(){const n=settings.jitterMode==='medium'?10:settings.jitterMode==='small'?4:0;return n?(Math.random()*2*n-n):0}
grab.onclick=()=>{if(state!=='ready')return;clicked=performance.now();$('reaction').textContent=fmt(clicked-opened);currentNetwork=networkMs();state='opening';const rect=grab.getBoundingClientRect(),h=Math.min(290,Math.max(250,window.innerHeight*.31)),top=Math.max(12,Math.min(window.innerHeight-h-12,rect.top-16));modal.style.setProperty('--modal-top',top+'px');modal.style.setProperty('--jitter',jitter()+'px');setTimeout(()=>{if(state!=='opening')return;state='sliding';cover.classList.add('show')},delayMs())};
function mx(){return track.clientWidth-thumb.clientWidth}function move(x){x=Math.max(0,Math.min(mx(),x));thumb.style.transform=`translateX(${x}px)`;progress.style.width=x+thumb.clientWidth+'px';if(x>=mx()-2)finish()}
function down(e){if(state!=='sliding')return;dragging=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;const t=getComputedStyle(thumb).transform;sp=t&&t!=='none'?new DOMMatrixReadOnly(t).m41:0;e.preventDefault()}function drag(e){if(!dragging||state!=='sliding')return;const p=e.touches?e.touches[0]:e;move(sp+p.clientX-sx);e.preventDefault()}
function finish(){if(state!=='sliding')return;state='done';const end=performance.now(),slide=end-clicked,total=end-opened,battle=total+currentNetwork;$('slideTime').textContent=fmt(slide);$('localTotal').textContent=fmt(total);$('battleTotal').textContent=fmt(battle);rec.push({at:new Date().toISOString(),campus,duration:Number(mode.value),reactionMs:clicked-opened,slideMs:slide,totalMs:total,battleMs:battle,networkMs:currentNetwork});save();renderCoach();progress.style.width='100%';timer.textContent=fmt(battle);timerLabel.textContent='模拟实战总用时';setTimeout(()=>cover.classList.remove('show'),300)}
thumb.addEventListener('touchstart',down,{passive:false});document.addEventListener('touchmove',drag,{passive:false});document.addEventListener('touchend',()=>dragging=false);thumb.addEventListener('mousedown',down);document.addEventListener('mousemove',drag);document.addEventListener('mouseup',()=>dragging=false);$('start').onclick=begin;
function renderHistory(){const a=vals('totalMs'),b=vals('battleMs');$('sumCount').textContent=a.length;$('sumBest').textContent=a.length?fmt(Math.min(...a)):'--';$('sumAvg').textContent=a.length?fmt(avg(a)):'--';$('sumBattle').textContent=b.length?fmt(avg(b)):'--';const box=$('records');box.innerHTML='';if(!rec.length){box.innerHTML='<div class="empty">还没有训练记录</div>';return}rec.slice().reverse().slice(0,100).forEach(r=>{const d=document.createElement('div');d.className='record';d.innerHTML='<div><b>纯手速 '+fmt(r.totalMs)+' · 实战 '+fmt(r.battleMs||r.totalMs)+'</b></div><div class="t">'+new Date(r.at).toLocaleString()+' · '+(r.campus||'未记录园区')+'</div><div class="total">'+fmt(r.battleMs||r.totalMs)+'</div>';box.appendChild(d)})}
$('campusBtn').onclick=()=>{renderCampus();$('campusCover').classList.add('show')};$('campusClose').onclick=()=>$('campusCover').classList.remove('show');$('historyBtn').onclick=()=>{renderHistory();$('historyCover').classList.add('show')};$('historyClose').onclick=()=>$('historyCover').classList.remove('show');$('settingsBtn').onclick=()=>{$('delayMode').value=settings.delayMode;$('networkMode').value=settings.networkMode;$('jitterMode').value=settings.jitterMode;$('settingsCover').classList.add('show')};$('settingsClose').onclick=()=>$('settingsCover').classList.remove('show');$('delayMode').onchange=e=>{settings.delayMode=e.target.value;saveSettings()};$('networkMode').onchange=e=>{settings.networkMode=e.target.value;saveSettings()};$('jitterMode').onchange=e=>{settings.jitterMode=e.target.value;saveSettings()};$('clearBtn').onclick=()=>{if(confirm('确定清空全部训练记录吗？')){rec=[];save();renderHistory();renderCoach()}};$('exportBtn').onclick=()=>{const b=new Blob([JSON.stringify(rec,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='parking-training-backup.json';a.click();URL.revokeObjectURL(a.href)};
applyCampus();renderCoach();timer.textContent=clock10(Number(mode.value)*1000);
</script>
</body></html>
