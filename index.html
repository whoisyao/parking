<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>抢车位训练 2.6</title>
<style>html,body{margin:0;background:#f4f6f9}#loading{height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#667085}</style>
</head>
<body>
<div id="loading">正在加载训练器…</div>
<script>
(async function(){
  try{
    const url='https://raw.githubusercontent.com/whoisyao/parking/3ec8b185ce931006cf5015b7807b41ae9ed492a4/index.html';
    let html=await (await fetch(url,{cache:'no-store'})).text();

    html=html
      .replaceAll('抢车位训练 2.3','抢车位训练 2.6')
      .replace('.timer-box{height:74px;background:#f3f6ff;border-radius:11px;display:grid;place-content:center;margin-bottom:14px}', '.timer-box{display:none}')
      .replace('.grab{width:100%;height:58px;border:0;border-radius:32px;background:#aec1ee;color:#fff;font-size:clamp(20px,5.5vw,24px);font-weight:650}', '.grab{width:100%;height:58px;border:0;border-radius:32px;background:var(--blue);color:rgba(255,255,255,.92);font-size:clamp(19px,5.2vw,23px);font-weight:500;font-variant-numeric:tabular-nums}')
      .replace('.grab.ready{background:var(--blue)}', '.grab.ready{background:var(--blue);color:#fff;font-weight:650}')
      .replace('.verify-modal{position:absolute;width:min(calc(100vw - 104px),380px);height:280px;background:#fff;border-radius:13px;left:50%;top:var(--modal-top,40vh);transform:translate(-50%,var(--jitter,0px));padding:112px 16px 0;box-shadow:0 10px 32px rgba(0,0,0,.14)}', '.verify-modal{position:absolute;width:min(calc(100vw - 80px),400px);height:280px;background:#fff;border-radius:13px;left:50%;top:var(--modal-top,40vh);transform:translate(-50%,var(--jitter,0px));padding:112px 12px 0;box-shadow:0 10px 32px rgba(0,0,0,.14)}')
      .replace('.progress{position:absolute;inset:0 auto 0 0;width:0;background:#dce9ff}', '.progress{position:absolute;inset:0 auto 0 0;width:0;background:#76cb25;z-index:1}')
      .replace('.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px}', '.tracktext{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px;z-index:0}')
      .replace('.thumb{position:absolute;left:0;top:0;width:72px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:36px;box-shadow:1px 0 5px rgba(0,0,0,.1)}', '.thumb{position:absolute;left:0;top:0;width:58px;height:60px;background:#fff;display:grid;place-items:center;color:#ccc;font-size:34px;box-shadow:1px 0 5px rgba(0,0,0,.1);z-index:2}')
      .replace('@media (min-width:700px){body{background:#e9edf4}', '@media (min-width:700px){body{background:#e9edf4}')
      .replace('.verify-modal{width:490px;height:min(430px,calc(100vh - 40px));max-height:430px;padding:clamp(120px,31vh,205px) 28px 0;border-radius:14px}', '.verify-modal{width:540px;height:min(430px,calc(100vh - 40px));max-height:430px;padding:clamp(120px,31vh,205px) 22px 0;border-radius:14px}')
      .replace('.thumb{height:64px;width:82px}', '.thumb{height:64px;width:104px}')
      .replace('<div class="timer-box"><div class="timer-label" id="timerLabel">等待开始训练</div><div class="timer" id="timer">00:05.00</div></div><button class="grab" id="grab">等待开抢</button>', '<div class="timer-box"><div class="timer-label" id="timerLabel">等待开始训练</div><div class="timer" id="timer">00:05.000</div></div><button class="grab" id="grab">00:05.000后开抢</button>')
      .replace("const timer=$('timer'),grab=$('grab'),overlay=$('overlay')", "const timer=$('timer'),grab=$('grab'),overlay=$('overlay')")
      .replace("function clock10(ms){ms=Math.max(0,Math.ceil(ms/10)*10);return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0')+'.'+String(Math.floor(ms%1000/10)).padStart(2,'0')}", "function clock10(ms){ms=Math.max(0,Math.ceil(ms/10)*10);return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0')+'.'+String(Math.floor(ms%1000)).padStart(3,'0')}")
      .replace("function applyCampus(){const c=campuses.find(x=>x.name===campus)||campuses[0];$('campusName').textContent=$('noticeCampus').textContent=c.name;$('spaces').textContent=c.spaces;localStorage.setItem(CK,c.name)}", "function applyCampus(){const c=campuses.find(x=>x.name===campus)||campuses[0];$('campusName').textContent=$('noticeCampus').textContent=c.name;$('spaces').textContent=c.spaces;$('online').textContent=286+Math.floor(Math.random()*227);localStorage.setItem(CK,c.name)}")
      .replace("function begin(){cancelAnimationFrame(raf);reset();target=performance.now()+Number(mode.value)*1000;state='waiting';grab.textContent='等待开抢';grab.classList.remove('ready');timer.classList.remove('ready');$('timerLabel').textContent='距离 19:00 开抢';tick()}", "function begin(){clearTimeout(raf);reset();target=performance.now()+Number(mode.value)*1000;state='waiting';grab.classList.remove('ready');timer.classList.remove('ready');$('timerLabel').textContent='距离 19:00 开抢';grab.textContent=clock10(Number(mode.value)*1000)+'后开抢';tick()}")
      .replace("function tick(){if(state!=='waiting')return;const remain=target-performance.now();if(remain<=0){timer.textContent='00:00.00';timer.classList.add('ready');$('timerLabel').textContent='开抢时间已到';grab.textContent='立即开抢';grab.classList.add('ready');opened=performance.now();state='ready';return}timer.textContent=clock10(remain);raf=requestAnimationFrame(tick)}", "function tick(){if(state!=='waiting')return;const remain=target-performance.now();if(remain<=0){timer.textContent='00:00.000';timer.classList.add('ready');$('timerLabel').textContent='开抢时间已到';grab.textContent='立即开抢';grab.classList.add('ready');opened=performance.now();state='ready';return}const shown=clock10(remain);timer.textContent=shown;grab.textContent=shown+'后开抢';raf=setTimeout(tick,10)}")
      .replace("function reset(){overlay.classList.remove('show');thumb.style.transform='translateX(0)';progress.style.width='0';", "function reset(){overlay.classList.remove('show');sliderTouched=0;dragging=false;thumb.style.transform='translateX(0)';progress.style.width='0';")
      .replace("progress.style.width=x+thumb.clientWidth+'px';if(x>=maxX()-2)finish()", "progress.style.width=x+'px';if(x>=maxX())finish()")
      .replace("progress.style.width='100%';timer.textContent=fmt(total)", "progress.style.width=maxX()+'px';timer.textContent=fmt(total)");

    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='加载失败，请刷新页面重试';
    console.error(e);
  }
})();
</script>
</body>
</html>
